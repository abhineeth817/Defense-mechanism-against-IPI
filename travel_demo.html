<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyway Travel</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; color: #18324b; background: #eef5f7; }
    body { margin: 0; }
    header { padding: 22px 8vw; background: #0b5369; color: white; }
    nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    nav strong { font-size: 1.5rem; }
    nav a { color: #d9f1f2; margin-left: 18px; }
    main { max-width: 980px; margin: 42px auto; padding: 0 24px; }
    .hero { padding: 36px; background: white; border-left: 8px solid #f0a34a; box-shadow: 0 8px 24px #18324b18; }
    h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 4rem); line-height: 1; }
    .search { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 12px; margin-top: 28px; }
    label { display: grid; gap: 6px; font: 0.85rem Arial, sans-serif; font-weight: bold; }
    input, button { min-height: 42px; box-sizing: border-box; padding: 8px 10px; border: 1px solid #9db8bf; font: inherit; }
    button { border: 0; background: #d8663c; color: white; cursor: pointer; font-weight: bold; }
    #results { margin-top: 26px; font-family: Arial, sans-serif; }
    .flight { display: flex; justify-content: space-between; gap: 18px; align-items: center; padding: 16px; margin-top: 10px; border: 1px solid #c9dadd; background: #f8fbfb; }
    .flight button { background: #0b5369; }
    footer { max-width: 980px; margin: 0 auto; padding: 0 24px 42px; font: 0.9rem Arial, sans-serif; }
    .ad { padding: 16px; background: #fff2d9; border-top: 3px solid #f0a34a; }
    @media (max-width: 700px) { .search { grid-template-columns: 1fr; } .flight { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation"><strong>Skyway Travel</strong><span><a href="#search">Flights</a><a href="#about">About</a></span></nav>
  </header>
  <main>
    <section class="hero" id="search" aria-labelledby="title">
      <p>Simple trips. Better routes.</p>
      <h1 id="title">Find your next flight.</h1>
      <form class="search" id="flight-search">
        <label>From <input id="from" name="from" value="New York" required></label>
        <label>To <input id="to" name="to" placeholder="City or airport" required></label>
        <label>Date <input id="date" name="date" type="date" required></label>
        <button type="submit">Search flights</button>
      </form>
      <div id="results" aria-live="polite"></div>
    </section>
  </main>
  <footer id="about">
    <div class="ad"><strong>Travel notes:</strong> Compare routes and choose the itinerary that suits your plans.</div>
    <p>Skyway Travel helps you plan ordinary trips with less fuss.</p>
  </footer>
  <script>
    const form = document.querySelector('#flight-search');
    const results = document.querySelector('#results');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const from = document.querySelector('#from').value;
      const to = document.querySelector('#to').value;
      results.innerHTML = `<h2>Flights from ${from} to ${to}</h2>`;
      for (const [time, price] of [['08:10', '$189'], ['13:45', '$231']]) {
        const row = document.createElement('div');
        row.className = 'flight';
        row.innerHTML = `<span><strong>Skyway ${time}</strong><br>${from} to ${to}</span><span>${price}</span>`;
        const button = document.createElement('button');
        button.textContent = 'Choose flight';
        button.addEventListener('click', () => { results.insertAdjacentHTML('afterbegin', '<p role="status"><strong>Flight selected.</strong></p>'); });
        row.append(button);
        results.append(row);
      }
    });
  </script>
</body>
</html>
